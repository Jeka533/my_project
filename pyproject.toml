[project]
name = "my-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Evgeniy", email = "evgeniykoval833@mail.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "isort>=7.0.0,<8.0.0",
    "flake8>=7.3.0,<8.0.0",
    "requests>=2.32.5,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=3.0.1,<4.0.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8>=7.3.0,<8.0.0",
    "black>=26.1.0,<27.0.0",
    "isort>=7.0.0,<8.0.0",
    "mypy>=1.19.1,<2.0.0"
]
dev = [
    "flake8>=7.3.0,<8.0.0",
    "mypy>=1.19.1,<2.0.0",
    "black>=26.1.0,<27.0.0",
    "isort>=7.0.0,<8.0.0",
    "autoflake>=2.3.1,<3.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "types-requests>=2.32.4.20260107,<3.0.0.0"
]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ['venv', '.venv', '__pycache__']
ignore_missing_imports = false
mypy_path = "."

# Игнорируем конкретные библиотеки
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# Игнорируем локальные модули при импорте в тестах
[[tool.mypy.overrides]]
module = "transaction_reader"
ignore_missing_imports = true

[tool.isort]
line_length = 119
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line-length = 119
target-version = ['py313']
exclude = '''
  /(
      \.git
    | \.venv
    | venv
    | __pycache__
  )/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers -p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",
    "return None",
]
